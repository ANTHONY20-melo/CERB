<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI Inventory - CERB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="sidebar">
    <div class="logo"><i class="fas fa-laptop-medical"></i> <span>TI SYSTEM</span></div>
    <nav id="sidebar-nav">
        <button class="nav-item active" onclick="showTab('pcs')"><i class="fas fa-desktop"></i> Computadores</button>
        <button class="nav-item" onclick="showTab('printers')"><i class="fas fa-print"></i> Impressoras</button>
        
        <div class="menu-label">NÚCLEOS</div>
        <div id="nucleos-menu">
            </div>

        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        
        <label for="fileInput" class="btn-import"><i class="fas fa-file-excel"></i> Importar Excel/CSV</label>
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" hidden>
        
        <button class="btn-danger" onclick="limparBase()"><i class="fas fa-trash"></i> Resetar Tudo</button>
    </nav>
</div>

<div class="main-content">
    <header>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Pesquisar em todo o inventário...">
        </div>
    </header>

    <div id="dashboard-resumo" class="dashboard-grid"></div>

    <div id="tab-pcs" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%">PC</th>
                        <th style="width: 20%">Usuário</th>
                        <th style="width: 10%">RAM</th>
                        <th style="width: 25%">Processador</th>
                        <th style="width: 15%">Nº de Série</th>
                        <th style="width: 15%">Ações</th>
                    </tr>
                </thead>
                <tbody id="pcTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-printers" class="tab-content" style="display:none;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%">Modelo</th>
                        <th style="width: 25%">Nº de Série</th>
                        <th style="width: 35%">Observação / Localização</th>
                        <th style="width: 15%">Ações</th>
                    </tr>
                </thead>
                <tbody id="printerTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="printableLabel" class="label-box">
            <h2 id="l-title"></h2>
            <div id="qrcode"></div>
            <p id="l-serial"></p>
            <p id="l-extra"></p>
        </div>
        <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Imprimir Etiqueta</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
