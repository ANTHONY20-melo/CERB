<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vital - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <h2><i class="fas fa-heartbeat"></i> SBM</h2>
        </div>
        <ul>
            <li id="menu-home" class="active" onclick="showSection('home')">
                <i class="fas fa-chart-line"></i> Dashboard
            </li>
            <li id="menu-agenda" onclick="showSection('agenda')">
                <i class="fas fa-calendar-alt"></i> Agenda
            </li>
            <li id="menu-financas" onclick="showSection('financas')">
                <i class="fas fa-hand-holding-usd"></i> Financeiro
            </li>
        </ul>
        <div style="margin-top: auto; padding: 10px; font-size: 0.8rem; color: #888;">
            v2.0 Stable
        </div>
    </aside>

    <div class="main-container">
        <header>
            <div class="header-left">
                <h3 id="page-title">Painel de Controle</h3>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/150?u=admin" alt="Foto Admin">
                    <span>Administrador</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </header>

        <main class="content" id="main-display">
            </main>
    </div>

    <div id="notification-container"></div>

    <script src="script.js"></script>
</body>
</html>
