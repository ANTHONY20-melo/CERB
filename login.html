<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica Vital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab { padding: 10px 20px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 600; background: white; color: var(--text-main); transition: all 0.3s; }
        .auth-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        /* Toast styles */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 220px; max-width: 360px; padding: 12px 14px; border-radius: 8px; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.12); display: flex; gap: 10px; align-items: center; font-weight: 600; }
        .toast-success { background: #27ae60; }
        .toast-error { background: #e74c3c; }
        .toast-info { background: #3498db; }
        .toast .toast-msg { font-weight: 600; }
        .toast.fadeOut { animation: toastOut 0.5s forwards; }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
    </style>
</head>
<body style="justify-content: center; align-items: center; background: var(--bg-body);">
    <div class="auth-container">
        <div class="login-card" style="width: 100%; max-width: 400px;">
            <i class="fas fa-clinic-medical" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h2>Clínica SBM</h2>
            <p style="color: var(--text-sub); margin-bottom: 25px;">Cuidados Integrados</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">Login</button>
                <button class="auth-tab" id="tab-registro">Cadastro</button>
            </div>

            <div class="auth-form active" id="form-login">
                <label for="user" class="sr-only">Usuário</label>
                <input type="text" id="user" name="username" autocomplete="off" placeholder="Seu usuário" style="width:100%; margin-bottom:12px;">
                <label for="pass" class="sr-only">Senha</label>
                <input type="password" id="pass" name="password" autocomplete="new-password" placeholder="Senha" style="width:100%; margin-bottom:15px;">
                <button id="btn-login" type="button" style="width:100%">Acessar Sistema</button>
            </div>

            <div class="auth-form" id="form-registro">
                <label for="reg-nome" class="sr-only">Nome Completo</label>
                <input type="text" id="reg-nome" placeholder="Nome Completo" style="width:100%; margin-bottom:12px;">
                <label for="reg-email" class="sr-only">Email</label>
                <input type="email" id="reg-email" placeholder="Email" style="width:100%; margin-bottom:12px;">
                <label for="reg-user" class="sr-only">Usuário</label>
                <input type="text" id="reg-user" placeholder="Usuário" style="width:100%; margin-bottom:12px;">
                <label for="reg-pass" class="sr-only">Senha</label>
                <input type="password" id="reg-pass" placeholder="Senha" style="width:100%; margin-bottom:12px;">
                <label for="reg-pass2" class="sr-only">Confirmar Senha</label>
                <input type="password" id="reg-pass2" placeholder="Confirmar Senha" style="width:100%; margin-bottom:15px;">
                <button id="btn-registro" type="button" style="width:100%;">Criar Conta</button>
            </div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script>
        // Função de exibição de notificações (toasts)
        function showToast(message, type = 'success', duration = 3500) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="toast-msg">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('fadeOut'); setTimeout(() => toast.remove(), 500); }, duration);
        }
        // showToast already defined above; aqui apenas usamos

        // Navegação entre abas
        document.getElementById('tab-login').addEventListener('click', () => {
            document.getElementById('form-login').classList.add('active');
            document.getElementById('form-registro').classList.remove('active');
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-registro').classList.remove('active');
        });

        document.getElementById('tab-registro').addEventListener('click', () => {
            document.getElementById('form-registro').classList.add('active');
            document.getElementById('form-login').classList.remove('active');
            document.getElementById('tab-registro').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
        });

        // Garante campos limpos no carregamento
        document.addEventListener('DOMContentLoaded', () => {
            try { document.getElementById('user').value = ''; document.getElementById('pass').value = ''; } catch (e){}
        });

        // Função SHA-256 simples usada para migrar senhas antigas
        async function sha256(password) {
            const enc = new TextEncoder();
            const data = enc.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        // Gera um salt aleatório (16 bytes = 128 bits)
        function generateSalt() {
            return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // PBKDF2 com SHA-256: deriveKey(password, salt) retorna { salt, hash }
        async function deriveKey(password, salt = null) {
            if (!salt) salt = generateSalt();
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
            const saltBuffer = new Uint8Array(salt.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBuffer, iterations: 100000, hash: 'SHA-256' }, baseKey, 256);
            const hashArray = Array.from(new Uint8Array(bits));
            const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return { salt, hash };
        }

        // Login (usa PBKDF2 com salt + migração de schema antigo)
        document.getElementById('btn-login').addEventListener('click', async function () {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if (!u || !p) { showToast('Preencha todos os campos!', 'error'); return; }

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            const usuario = usuarios.find(usr => usr.usuario === u);
            if (!usuario) { showToast('Usuário ou senha incorretos!', 'error'); return; }

            let valid = false;
            if (usuario.salt) {
                const { hash: hashedInput } = await deriveKey(p, usuario.salt);
                if (usuario.senha === hashedInput) valid = true;
            } else {
                // suporte legado: senha gravada como SHA256
                const legacy = await sha256(p);
                if (usuario.senha === legacy) {
                    valid = true;
                }
                // também suporte legado mais antigo: senha em texto simples
                if (!valid && usuario.senha === p) {
                    valid = true;
                }
                if (valid) {
                    // migrar para PBKDF2+salt
                    const { salt, hash } = await deriveKey(p);
                    usuario.salt = salt;
                    usuario.senha = hash;
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                }
            }

            if (!valid) { showToast('Usuário ou senha incorretos!', 'error'); return; }

            const usuarioSessao = Object.assign({}, usuario);
            delete usuarioSessao.senha;
            delete usuarioSessao.salt;
            sessionStorage.setItem('usuarioLogado', JSON.stringify(usuarioSessao));
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            window.location.href = 'index.html';
        });


        // Registro
        document.getElementById('btn-registro').addEventListener('click', async function () {
            const nome = document.getElementById('reg-nome').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const usuario = document.getElementById('reg-user').value.trim();
            const senha = document.getElementById('reg-pass').value;
            const senha2 = document.getElementById('reg-pass2').value;

            if (!nome || !email || !usuario || !senha || !senha2) { showToast('Preencha todos os campos!', 'error'); return; }
            if (senha !== senha2) { showToast('As senhas não coincidem!', 'error'); return; }

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            if (usuarios.find(u => u.usuario === usuario)) { showToast('Usuário já existe!', 'error'); return; }

            const { salt, hash } = await deriveKey(senha);
            const novoUsuario = { id: Date.now(), nome, email, usuario, salt, senha: hash, perfil: 'usuario', dataCriacao: new Date().toLocaleDateString() };
            usuarios.push(novoUsuario);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            // Envia para Formspree
            try {
                const resp = await fetch('https://formspree.io/f/xpqjbyzw', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: novoUsuario.nome, email: novoUsuario.email, usuario: novoUsuario.usuario, perfil: novoUsuario.perfil, dataCriacao: novoUsuario.dataCriacao })
                });

                if (resp.ok) showToast('Conta criada com sucesso! Dados enviados ao servidor.', 'success');
                else showToast('Conta criada localmente, falha ao enviar ao servidor.', 'info');
            } catch (err) {
                showToast('Conta criada localmente, erro ao enviar ao servidor.', 'info');
            }

            // após cadastro, autenticar automaticamente e redirecionar
            const usuarioSessao = Object.assign({}, novoUsuario);
            delete usuarioSessao.senha;
            delete usuarioSessao.salt;
            sessionStorage.setItem('usuarioLogado', JSON.stringify(usuarioSessao));
            // navega para o dashboard
            window.location.href = 'index.html';
        });

        if (!JSON.parse(localStorage.getItem('usuarios'))) {
            localStorage.setItem('usuarios', JSON.stringify([{ id: 1, nome: 'Administrador', email: 'admin@clinica.com', usuario: 'admin', salt: '01bd3c7a4e235b84fa63220382f02690', senha: '5835d00154a3deeb788087291f06dae80a029be09c528b053dac15d57144e044', perfil: 'admin', dataCriacao: '01/01/2026' }]));
        }
    </script>
</body>
</html>
